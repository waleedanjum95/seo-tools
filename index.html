<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free SEO Tools Hub - Meta Tag Generator</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 700px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #007bff; text-align: center; }
        label { font-weight: bold; margin-top: 10px; display: block; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #007bff; color: white; padding: 12px 20px; border: none; border-radius: 4px; margin-top: 15px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background: #0056b3; }
        .output-box { margin-top: 20px; background: #272822; color: #f8f8f2; padding: 15px; border-radius: 5px; font-family: monospace; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>

<div class="container">
    <h1>Meta Tag Generator Tool</h1>
    <p>Apni website ke liye SEO Meta Tags generate karen:</p>
    
    <label>Site Title:</label>
    <input type="text" id="title" placeholder="e.g. My Awesome SEO Tools Website">
    
    <label>Site Description:</label>
    <textarea id="desc" rows="3" placeholder="Apni website ki short detail yahan likhen..."></textarea>
    
    <label>Keywords (Commas se separate karen):</label>
    <input type="text" id="keywords" placeholder="e.g. seo tools, meta generator, free tools">
    
    <button onclick="generateTags()">Meta Tags Generate Karen</button>

    <h3>Aap Ka Generated Code:</h3>
    <div class="output-box" id="result">&lt;!-- Code yahan nazar aaye ga --&gt;</div>
</div>

<script>
function generateTags() {
    var title = document.getElementById("title").value;
    var desc = document.getElementById("desc").value;
    var keywords = document.getElementById("keywords").value;

    var code = `<!-- Primary Meta Tags -->\n` +
               `<title>${title}</title>\n` +
               `<meta name="title" content="${title}">\n` +
               `<meta name="description" content="${desc}">\n` +
               `<meta name="keywords" content="${keywords}">`;

    document.getElementById("result").innerText = code;
}
</script>

</body>
</html>
