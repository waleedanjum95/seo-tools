<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO Tools Hub</title>
    <!-- Google AdSense Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5281431128852435" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f6f9;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            color: #1a73e8;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button.btn-primary {
            background-color: #0066ff;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            font-weight: bold;
        }
        button.btn-primary:hover {
            background-color: #0052cc;
        }
        /* Footer Styling */
        footer {
            margin-top: 40px;
            text-align: center;
            padding: 20px;
            font-size: 14px;
            border-top: 1px solid #e0e0e0;
        }
        footer a {
            color: #0066ff;
            text-decoration: none;
            margin: 0 8px;
            font-weight: 500;
        }
        footer a:hover {
            text-decoration: underline;
        }
        /* Modal Popup Styling */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-box {
            background: #ffffff;
            border-radius: 10px;
            max-width: 650px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            line-height: 1.6;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            border: none;
            background: #e4e6eb;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            color: #555;
        }
        .close-btn:hover {
            background: #d8dadf;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>SEO Tools Hub</h1>
        <p style="text-align:center;">Generate accurate meta tags for your website effortlessly.</p>

        <!-- Meta Tag Generator Form -->
        <div class="form-group">
            <label for="siteTitle">Site Title</label>
            <input type="text" id="siteTitle" placeholder="Example: My Awesome Website">
        </div>

        <div class="form-group">
            <label for="siteDesc">Site Description</label>
            <textarea id="siteDesc" rows="3" placeholder="Brief summary of your website content..."></textarea>
        </div>

        <div class="form-group">
            <label for="siteKeywords">Keywords (Comma Separated)</label>
            <input type="text" id="siteKeywords" placeholder="seo tools, online generator, webmaster">
        </div>

        <button class="btn-primary" onclick="generateMeta()">Generate Meta Tags</button>

        <div class="form-group" style="margin-top:20px;">
            <label for="outputCode">Generated Code:</label>
            <textarea id="outputCode" rows="5" readonly style="background:#222; color:#00ffcc; font-family:monospace;"></textarea>
        </div>
    </div>

    <!-- Working Footer Links -->
    <footer>
        <a href="javascript:void(0)" onclick="openModal('about')">About Us</a> | 
        <a href="javascript:void(0)" onclick="openModal('privacy')">Privacy Policy</a> | 
        <a href="javascript:void(0)" onclick="openModal('terms')">Terms & Conditions</a> | 
        <a href="javascript:void(0)" onclick="openModal('contact')">Contact Us</a>
        <p>© 2026 SEO Tools Hub. All rights reserved.</p>
    </footer>

    <!-- Modal Popup Box -->
    <div id="infoModal" class="modal-overlay">
        <div class="modal-box">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        // Meta Tag Generator Function
        function generateMeta() {
            const title = document.getElementById('siteTitle').value || 'My Website';
            const desc = document.getElementById('siteDesc').value || '';
            const keywords = document.getElementById('siteKeywords').value || '';

            const metaCode = `<meta name="title" content="${title}">\n<meta name="description" content="${desc}">\n<meta name="keywords" content="${keywords}">`;
            document.getElementById('outputCode').value = metaCode;
        }

        // Pages Content Data
        const pagesData = {
            about: `
                <h2 style="color:#1a73e8;">About Us</h2>
                <p>Welcome to <strong>SEO Tools Hub</strong>, managed by <strong>Waleed Anjum</strong>. We are dedicated to providing fast, reliable, and user-friendly web utilities designed specifically for webmasters, digital marketers, and developers.</p>
                <p>Our tools help streamline search engine optimization tasks, meta tag generation, and website structure optimization without requiring advanced technical skills or software installation.</p>
                <p>Our mission is to empower site owners to grow their online reach efficiently.</p>
            `,
            privacy: `
                <h2 style="color:#1a73e8;">Privacy Policy</h2>
                <p>At <strong>SEO Tools Hub</strong> (seotoolshub.netlify.app), accessible from our web app, visitor privacy is extremely important to us. This Privacy Policy outlines the types of information collected and how it is used.</p>
                <h3>Log Files & Cookies</h3>
                <p>Like most website platforms, SEO Tools Hub uses log files and standard cookies to optimize user experience and analyze general traffic trends.</p>
                <h3>Google DoubleClick DART Cookie</h3>
                <p>Google is a third-party vendor on our site. It uses cookies, known as DART cookies, to serve ads to our site visitors based upon their visit to our site and other internet pages.</p>
                <h3>Third Party Privacy Policies</h3>
                <p>SEO Tools Hub's Privacy Policy does not apply to other advertisers or websites. We advise you to consult the respective Privacy Policies of these third-party ad servers for more detailed information.</p>
            `,
            terms: `
                <h2 style="color:#1a73e8;">Terms and Conditions</h2>
                <p>By accessing and using <strong>SEO Tools Hub</strong>, you accept and agree to be bound by the terms and provisions of this agreement.</p>
                <h3>Use License</h3>
                <p>Permission is granted to temporarily use the tools provided on SEO Tools Hub for personal or commercial website optimization purposes. You may not attempt to reverse engineer or misuse any service provided on this site.</p>
                <h3>Disclaimer</h3>
                <p>The tools and services on SEO Tools Hub are provided "as is". We make no warranties, expressed or implied, regarding the accuracy or reliability of generated codes or recommendations.</p>
            `,
            contact: `
                <h2 style="color:#1a73e8;">Contact Us</h2>
                <p>If you have any questions, suggestions, or issues regarding SEO Tools Hub, feel free to reach out to us directly:</p>
                <ul style="list-style:none; padding:0; line-height:2;">
                    <li><strong>Owner:</strong> Waleed Anjum</li>
                    <li><strong>Email:</strong> <a href="mailto:waleedanjum.18@gmail.com">waleedanjum.18@gmail.com</a></li>
                    <li><strong>Phone:</strong> <a href="tel:+923336349195">00923336349195</a></li>
                    <li><strong>Website:</strong> seotoolshub.netlify.app</li>
                </ul>
            `
        };

        // Modal Functions
        function openModal(page) {
            document.getElementById('modalContent').innerHTML = pagesData[page];
            document.getElementById('infoModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('infoModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('infoModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
